<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>КОЛЬЦЕБРОС</title><link rel="stylesheet" href="/static/style.css"><script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script><style>
body{overflow:hidden}.s{height:100vh;display:flex;flex-direction:column;align-items:center;padding:4vh}.title{font-size:clamp(36px,4.5vw,80px);font-weight:1000;color:#ff51b0;letter-spacing:.08em}.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}.name{font-size:clamp(42px,6vw,105px);font-weight:1000}.score{font-size:clamp(150px,25vw,430px);font-weight:1000;line-height:.85}.pts{font-size:clamp(25px,3vw,52px);color:#ff72c4;font-weight:900;letter-spacing:.2em}.wait{font-size:clamp(50px,8vw,140px);font-weight:1000}.plus{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);font-size:clamp(80px,12vw,200px);font-weight:1000;color:#ff4cae;opacity:0}.plus.go{animation:p .8s ease-out}@keyframes p{20%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%) scale(1.15)}}.results{width:min(950px,90vw)}.row{display:grid;grid-template-columns:80px 1fr auto;gap:12px;padding:14px 22px;margin:8px;border:1px solid #6d1b4b;border-radius:15px;background:#100810;font-size:clamp(22px,2.4vw,40px);font-weight:900}.rs{color:#ff66bb}
</style></head><body><main class="s"><div class="title glow">КОЛЬЦЕБРОС</div><div id="stage" class="stage"></div><div id="plus" class="plus"></div></main><script>
const so=io(),st=document.getElementById("stage"),pl=document.getElementById("plus");let old=-1,lastNonce=-1;
function render(s){if(s.phase==="setup"){st.innerHTML='<div class="wait glow">ОЖИДАНИЕ</div>';return}
if(s.phase==="finished"){let c=["🥇","🥈","🥉"];st.innerHTML='<div class="results">'+s.ranking.map((r,i)=>`<div class="row"><span>${c[i]||""}</span><span>${r.name}</span><span class="rs">${r.score}</span></div>`).join("")+"</div>";return}
st.innerHTML=`<div class="name glow">${s.name}</div><div class="score">${s.score}</div><div class="pts">ОЧКОВ</div>`;
if(s.last&&s.last.nonce!==lastNonce){lastNonce=s.last.nonce;pl.textContent="+"+s.last.p;pl.classList.remove("go");void pl.offsetWidth;pl.classList.add("go")}}
so.on("state",render)</script></body></html>
