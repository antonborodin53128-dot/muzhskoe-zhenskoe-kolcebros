<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>КОЛЬЦЕБРОС — ведущий</title><link rel="stylesheet" href="/static/style.css"><script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script><style>
.w{max-width:850px;margin:auto;padding:20px}.head{text-align:center;font-size:48px;font-weight:1000;color:#ff50af;margin:10px}.card{background:#0e080e;border:1px solid #5c1741;border-radius:20px;padding:20px;margin:16px 0}.label{font-weight:900;color:#d8c5d1;margin-bottom:12px}.cnt{display:flex;justify-content:center;align-items:center;gap:18px}.cnt button,.b{background:#180b15;color:#fff;border:1px solid #8c225f;border-radius:13px;min-height:54px;padding:10px 18px;font-weight:900}.num{font-size:42px;font-weight:1000}.primary{width:100%;margin-top:18px;background:#e82289;color:#fff;border:0;border-radius:14px;padding:17px;font-size:21px;font-weight:1000}.who{text-align:center;font-size:28px;font-weight:900}.score{text-align:center;color:#ff55b1;font-size:72px;font-weight:1000}.adds{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.adds button{background:#180b15;color:#fff;border:1px solid #a32970;border-radius:14px;padding:20px 4px;font-size:23px;font-weight:1000}.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.acts button{padding:15px;border-radius:13px;background:#151015;color:#fff;border:1px solid #4b3442;font-weight:800}.acts .next{grid-column:1/-1;background:#e82289;border:0;font-size:20px}.table{display:none;margin-top:14px}.table.open{display:block}.tr{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #33222d;font-weight:800}.finish-zone{margin-top:42px;padding-top:18px;border-top:1px solid #2a1b24;text-align:center}.finish-zone button{background:transparent;color:#806d79;border:1px solid #3a2933;border-radius:11px;padding:10px 18px;font-size:13px;font-weight:700}@media(max-width:600px){.adds{grid-template-columns:repeat(3,1fr)}.acts{grid-template-columns:1fr}}
</style></head><body><main class="w"><div class="head glow">КОЛЬЦЕБРОС</div>
<section id="setup" class="card"><div class="label">КОЛИЧЕСТВО УЧАСТНИКОВ</div><div class="cnt"><button id="m">−</button><div id="n" class="num">4</div><button id="p">+</button></div><button id="start" class="primary">НАЧАТЬ</button></section>
<section id="game" class="card" style="display:none"><div id="who" class="who"></div><div id="score" class="score"></div><div class="adds"><button data-v="10">+10</button><button data-v="15">+15</button><button data-v="20">+20</button><button data-v="25">+25</button><button data-v="30">+30</button></div><div class="acts"><button id="undo">↶ ОТМЕНИТЬ</button><button id="next" class="next">СЛЕДУЮЩИЙ УЧАСТНИК</button></div><div class="finish-zone"><button id="finish">ЗАВЕРШИТЬ КОНКУРС</button></div></section>
<section id="done" class="card" style="display:none"><div class="label">ИТОГОВЫЕ РЕЗУЛЬТАТЫ</div><div id="final"></div><button id="reset2" class="primary">НАЧАТЬ ЗАНОВО</button></section></main><script>
const so=io(),$=x=>document.getElementById(x);let n=4;
$("m").onclick=()=>{$("n").textContent=n=Math.max(1,n-1)};$("p").onclick=()=>{$("n").textContent=n=Math.min(10,n+1)};$("start").onclick=()=>so.emit("setup",{count:n});
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>so.emit("add",{points:+b.dataset.v}));$("undo").onclick=()=>so.emit("undo");$("next").onclick=()=>so.emit("next");$("finish").onclick=()=>so.emit("finish");$("reset2").onclick=()=>so.emit("reset");
function rows(a){let c=["🥇","🥈","🥉"];return a.map((r,i)=>`<div class="tr"><span>${c[i]||""} ${r.name}</span><b>${r.score}</b></div>`).join("")}
so.on("state",s=>{$("setup").style.display=s.phase==="setup"?"block":"none";$("game").style.display=s.phase==="playing"?"block":"none";$("done").style.display=s.phase==="finished"?"block":"none";if(s.phase==="playing"){$("who").textContent=s.name;$("score").textContent=s.score;$("next").textContent=s.current===s.count-1?"ПОКАЗАТЬ РЕЗУЛЬТАТЫ":"СЛЕДУЮЩИЙ УЧАСТНИК"}if(s.phase==="finished")$("final").innerHTML=rows(s.ranking)})</script></body></html>
